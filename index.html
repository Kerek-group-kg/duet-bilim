.shadow-sm{

  --tw-shadow-colored: 0 1px 2px 0 var(--tw-shadow-color);
  box-shadow: var(--tw-ring-offset-shadow, 0 0 #0000), var(--tw-ring-shadow, 0 0 #0000), var(--tw-shadow);
}

.filter{

.backdrop-blur{

.\[overflow-wrap\:anywhere\]{
  overflow-wrap: anywhere;
}

:root{
  --surface:#FFF8E8;
  --surface-2:#FFFFFF;
  --ink:#221A3A;
  --muted:#6B6488;
  --purple:#7C3AED;
  --purple-2:#A855F7;
  --yellow:#FFC531;
  --green:#1DB954;
  --pink:#FF5A8A;
  --blue:#2AA5FF;
  --line:#EFE3FF;
}

@media (prefers-color-scheme: dark){
  :root{
    --surface:#17112A;
    --surface-2:#241A42;
    --ink:#FFF6E5;
    --muted:#C6BDE0;
    --line:#3B2E68;
  }
}

*{
  box-sizing:border-box
}

body{
  margin:0;
  font-family:'Nunito',system-ui,sans-serif;
  background:var(--surface);
  color:var(--ink)
}

h1,h2,h3,.display{
  font-family:'Baloo 2',system-ui,sans-serif
}

button{
  font-family:inherit
}

.no-scrollbar::-webkit-scrollbar{
  display:none
}

.no-scrollbar{
  scrollbar-width:none
}

.card{
  border-radius:26px;
  background:var(--surface-2);
  border:2px solid var(--line);
  box-shadow:0 10px 0 rgba(34,26,58,.06)
}

.chip{
  border-radius:999px;
  padding:7px 12px;
  font-weight:900;
  font-size:13px
}

input,textarea,select{
  font-family:inherit;
  outline:none
}

input:focus,textarea:focus,select:focus{
  border-color:var(--purple)!important;
  box-shadow:0 0 0 4px rgba(124,58,237,.15)
}

.hover\:bg-\[\#F3EEFF\]:hover{
  --tw-bg-opacity: 1;
  background-color: rgb(243 238 255 / var(--tw-bg-opacity, 1));
}

.active\:scale-\[\.98\]:active{
  --tw-scale-x: .98;
  --tw-scale-y: .98;
  transform: translate(var(--tw-translate-x), var(--tw-translate-y)) rotate(var(--tw-rotate)) skewX(var(--tw-skew-x)) skewY(var(--tw-skew-y)) scaleX(var(--tw-scale-x)) scaleY(var(--tw-scale-y));
}

.disabled\:opacity-60:disabled{
  opacity: 0.6;
}

@media (min-width: 640px){
  .sm\:grid-cols-2{
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .sm\:gap-3{
    gap: 0.75rem;
  }

  .sm\:p-4{
    padding: 1rem;
  }

  .sm\:text-sm{
    font-size: 0.875rem;
    line-height: 1.25rem;
  }
}

0B8",intro:"Сын атооч заттын белгисин билдирет: түсү, чоңдугу, даамы, сапаты. Сын атоочсуз сүйлөм куру болот, бирок түстүү болбойт. Бул сабакта «кандай? кайсы?» деген суроолорго жооп беребиз.",sections:[{h:"1. Сын атооч деген эмне?",t:"Сын атооч — «кандай? кайсы? кандайча?» деген суроолорго жооп берген сөз. Ал заттын белгисин көрсөтөт.",examples:["Кандай? — Жылуу, чоң, кызыл, жакшы.","Кайсы? — Бул, тигил, ошол."]},{h:"2. Белгинин түрлөрү",t:"Түсү: кызыл, көк, сары. Чоңдугу: чоң, кичине, бийик. Даамы: таттуу, ачуу. Сапаты: акылдуу, боорукер.",examples:["Таттуу алма, жылуу күн, акылдуу бала."]},{h:"3. Сүйлөмдө колдонуу",t:"Сын атооч көбүнчө зат атоочтун алдында турат: «жылуу күн», «жакшы дос». Ал сүйлөмдү бай жана так кылат.",examples:["Менин жакшы досум бар.","Бүгүн жылуу күн болду."]},{h:"4. Салыштыруу",t:"«Чоң — чоңураак — эң чоң» сыяктуу салыштырса болот. Күнүмдүк турмушта эки нерсени салыштырып сүйлөйбүз.",examples:["Тоо бийик, ал эми үй андан кичине."]}],vocab:[["Сын атооч","Заттын белгисин билдирген сөз"],["Белги","Заттын түсү, чоңдугу, сапаты"],["Түс","Кызыл, көк, сары, жашыл"],["Сапат","Жакшы, акылдуу, боорукер"],["Салыштыруу","Эки нерсени салыштырып айтуу"]]},{id:3,subject:"Кыргыз тили",title:"Этиш",level:"Орто",mins:15,xp:95,emoji:"\uD83C\uDFC3",color:"#D9F2FF",intro:"Этиш — аракетти билдирген сөз. Биз күн сайын жүздөгөн аракет жасайбыз: ойгонобуз, окуйбуз, ойнойбуз. Этишти билбей туруп эмне кылып жатканыбызды айта албайбыз.",sections:[{h:"1. Этиш деген эмне?",t:"Этиш — «эмне кылат? эмне кылды? эмне кыласың?» деген суроолорго жооп берет. Ал кыймылды, аракетти билдирет.",examples:["Окуйт, жазат, чуркайт, ойнойт, уктайт."]},{h:"2. Чактар",t:"Азыркы чак — азыр болуп жаткан аракет: окуйт. Өткөн чак — болуп өткөн: окуду. Келер чак — боло турган: окуйт (эртең).",examples:["Кечээ китеп окудум.","Бүгүн китеп окуп жатам.","Эртең китеп окуйм."]},{h:"3. Этиштин жактары",t:"Мен окуйм, сен окуйсуң, ал окуйт, биз окуйбуз, силер окуйсуңар, алар окушат. Жакка жараша этиштин аягы өзгөрөт.",examples:["Мен — окуйм, Сен — окуйсуң, Ал — окуйт."]},{h:"4. Сүйлөм түзүү",t:"Ээ + баяндооч: «Бала ойнойт». Сүйлөмгө убакыт жана орун кошсоң толук болот: «Бала аянтта ойнойт».",examples:["Айпери үйдө китеп окуп жатат."]}],vocab:[["Этиш","Аракетти билдирген сөз"],["Чак","Азыркы, өткөн, келер чак"],["Аракет","Окуу, жазуу, ойноо"],["Баяндооч","Сүйлөмдө аракетти көрсөткөн мүчө"],["Кыймыл","Чуркоо, секирүү, басуу"]]},{id:4,subject:"Математика",title:"Бөлчөктөр",level:"Башталгыч",mins:16,xp:95,emoji:"\uD83E\uDDEE",color:"#FFF0B8",intro:"Бөлчөк — бүтүндүн бир бөлүгү. Пиццаны 4кө бөлүп, 1 кесимин жесең — 1/4 жедиң. Бул сабакта бөлчөктү окуйбуз, салыштырабыз жана кошообуз.",sections:[{h:"1. Бөлчөк деген эмне?",t:"Бөлчөк сызык менен жазылат. Жогорудагы сан — алым, төмөндөгү — бөлүм. Бөлүм бүтүн канча бөлүккө бөлүнгөнүн, алым канча бөлүк алынгандыгын көрсөтөт.",examples:["1/2 — жарымы, 1/4 — төрттөн бири.","Пицца 4 бөлүк: 1 бөлүк = 1/4."]},{h:"2. Алым жана бөлүм",t:"3/4тө алым — 3, бөлүм — 4. Алым бөлүмдөн кичине болсо — жөнөкөй бөлчөк. Алым чоң болсо — туура эмес бөлчөк.",examples:["2/5 — жөнөкөй, 5/2 — туура эмес."]},{h:"3. Кошуу жана кемитүү",t:"Бөлүмү бирдей бөлчөктөрдү кошуу оңой: алымдар кошулат, бөлүм өзгөрбөйт. 2/5 + 1/5 = 3/5.",examples:["3/8 + 2/8 = 5/8","5/6 − 2/6 = 3/6 = 1/2"]},{h:"4. Күнүмдүк мисал",t:"Дүкөндө нандын жарымын, алманын төрттөн бирин алсаң — бөлчөк менен эсептейсиң. Бөлчөк — күнүмдүк жашоонун бир бөлүгү.",examples:["Сааттын жарымы — 30 мүнөт = 1/2 саат."]}],vocab:[["Бөлчөк","Бүтүндүн бир бөлүгү"],["Алым","Сызыктан жогорудагы сан"],["Бөлүм","Сызыктан төмөндөгү сан"],["Жарымы","1/2 — экиге бөлүнгөн бүтүн"],["Төрттөн бири","1/4 — төрткө бөлүнгөн бүтүн"]]},{id:5,subject:"Математика",title:"Теңдемелер",level:"Орто",mins:16,xp:100,emoji:"\uD83E\uDDE9",color:"#E9DFFF",intro:"Теңдеме — белгисизи бар барабардык. Ал — жашыруун санды табуу оюну сыяктуу. Белгисизди x менен белгилеп, аны табуу үчүн эки тарап менен бирдей аракет жасайбыз.",sections:[{h:"1. Теңдеме деген эмне?",t:"Теңдемеде «=» белгиси жана белгисиз сан болот. Мисалы: x + 7 = 12. Биздин максат — xти табуу.",examples:["x + 7 = 12 → x = 5"]},{h:"2. Белгисизди табуу",t:"Барабардыкты сактоо үчүн эки тарапка бирдей аракет кылабыз. Кошулган санды азайтабыз, көбөйтүлгөн санга бөлөбүз.",examples:["2x = 14 → x = 14 ÷ 2 = 7","3x + 3 = 18 → 3x = 15 → x = 5"]},{h:"3. Текшерүү",t:"Табылган санды теңдемеге коюп текшер: 5 + 7 = 12 — туура! Текшерүү — катаны табуунун эң жакшы жолу.",examples:["x=5 болсо, 5+7=12 — туура."]},{h:"4. Күнүмдүк мисал",t:"Сенде 100 сом бар, 35 сомго китеп алдың. Канча сом калды? 100 − 35 = x → x = 65. Бул да теңдеме!",examples:["Дүкөндөгү эсеп — күнүмдүк теңдеме."]}],vocab:[["Теңдеме","Белгисизи бар барабардык"],["Белгисиз","Табыла турган сан — көбүнчө x"],["Барабардык","Эки тарап тең — «=»"],["Текшерүү","Жоопту кайра коюп текшерүү"],["Чыгаруу","Теңдемени чечүү жолу"]]},{id:6,subject:"Математика",title:"Пайыздар",level:"Орто",mins:15,xp:100,emoji:"\uD83D\uDCB0",color:"#DFF7D6",intro:"Пайыз — жүздөн бир бөлүк. Дүкөндө «−20% арзандатуу» дегенди көрсөң — бул пайыз. Пайызды билсең, арзандатууну, бааны жана үнөмдү оңой эсептейсиң.",sections:[{h:"1. Пайыз деген эмне?",t:"1% — 100дүн 1 бөлүгү. 50% — жарымы, 25% — төрттөн бири, 10% — ондон бири. Пайызды % белгиси менен жазабыз.",examples:["100дүн 50%ы = 50","200дүн 25%ы = 50"]},{h:"2. Пайызды табуу",t:"Санды пайызга көбөйтүп, 100гө бөлөбүз. Мисалы: 15тин 20%ы = 15 × 20 ÷ 100 = 3.",examples:["80дин 10%ы = 8","60тын 50%ы = 30"]},{h:"3. Арзандатуу",t:"Китеп 200 сом, арзандатуу 20%. Арзандатуу: 200 × 20 ÷ 100 = 40 сом. Жаңы баа: 200 − 40 = 160 сом.",examples:["Арзандатуу — үнөмдөө мүмкүнчүлүгү."]},{h:"4. Күнүмдүк эсеп",t:"Ата-энең менен дүкөнгө барганда арзандатууну өзүң эсептеп көр. Пайыз — чоңдордун да күн сайын колдонгон эсеби.",examples:["Эгер 500 сомдун 10%ы үнөмдөлсө — 50 сом калат."]}],vocab:[["Пайыз","Жүздөн бир бөлүк — %"],["Арзандатуу","Баанын төмөндөшү"],["Жарымы","50% — экиге бөлүнгөн бүтүн"],["Үнөм","Акчаны сактоо"],["Баа","Нерсенин акчадагы наркы"]]},{id:7,subject:"Англис тили",title:"Present Simple",level:"Орто",mins:14,xp:90,emoji:"\uD83C\uDDEC\uD83C\uDDE7",color:"#D9F2FF",intro:"Present Simple — азыркы жөнөкөй чак. Күн сайын кайталанган аракеттерди айтуу үчүн колдонобуз: I wake up, I go to school, I play. Бул — англисче сүйлөөнүн негизи.",sections:[{h:"1. Качан колдонобуз?",t:"Күнүмдүк адаттар, чындыктар, графиктер үчүн: I study every day. The sun rises in the east.",examples:["I wake up at 7.","She goes to school."]},{h:"2. He / She / It эрежеси",t:"He, she, it менен этишке -s же -es кошулат: he plays, she watches. Калгандары менен этиш өзгөрбөйт: I play, they play.",examples:["He reads books.","They read books."]},{h:"3. Суроо жана терс форма",t:"Суроо: Do you like...? Does she like...? Терс: I do not like..., She does not like...",examples:["Do you like music? — Yes, I do.","She does not like milk."]},{h:"4. Күндөлүк диалог",t:"— What do you do every morning? — I wake up, I wash my face, I eat breakfast. Кыска диалог менен Present Simpleди кайтала.",examples:["I go to school at 8. I study and play with friends."]}],vocab:[["Wake up","Ойгоноo"],["Study","Окуу"],["Play","Ойноо"],["Every day","Күн сайын"],["Friend","Дос"]]},{id:8,subject:"Англис тили",title:"My Family vocabulary",level:"Башталгыч",mins:12,xp:80,emoji:"\uD83D\uDC68‍\uD83D\uDC69‍\uD83D\uDC67",color:"#FFD9E8",intro:"My Family — менин үй-бүлөм. Бул сабакта үй-бүлө мүчөлөрүн англисче айтууну жана өзүңдү тааныштырууну үйрөнөбүз: This is my mother. She is kind.",sections:[{h:"1. Үй-бүлө мүчөлөрү",t:"Mother — апа, father — ата, sister — эже/карындаш, brother — байке/ини, grandmother — чоң апа, grandfather — чоң ата.",examples:["My mother is kind.","My brother is funny."]},{h:"2. Өзүңдү тааныштыруу",t:"My name is Aiperi. I am 11 years old. I have a mother, a father and a sister. Кыска тааныштыруу менен башта.",examples:["Hello! My name is... I live in Kyrgyzstan."]},{h:"3. Менин үй-бүлөм",t:"Менин үй-бүлөм жөнүндө 5 сүйлөм түз: ким бар, алар кандай, эмне кылышат. Мисалы: My father works. My mother cooks.",examples:["My family is big and kind."]},{h:"4. Диалог",t:"— Who is this? — This is my sister. She is my best friend. Досуң менен диалог түзүп, үй-бүлөңдү тааныштыр.",examples:["This is my family. I love my family."]}],vocab:[["Mother","Апа"],["Father","Ата"],["Sister","Эже / карындаш"],["Brother","Байке / ини"],["Family","Үй-бүлө"]]},{id:9,subject:"Тарых",title:"Манас эпосу",level:"Орто",mins:18,xp:110,emoji:"\uD83C\uDFD4️",color:"#DFF7D6",intro:"Манас эпосу — кыргыз элинин улуу мурасы. Ал баатыр Манастын, анын уулу Семетейдин жана небереси Сейтектин эрдигин баяндайт. Эпосту манасчылар жатка айтып, муундан муунга өткөрүп келген.",sections:[{h:"1. Манас ким?",t:"Манас — элин коргогон, кыргыз урууларын бириктирген баатыр. Ал акылман, кайраттуу жана адилеттүү болгон.",examples:["Манас элин душмандан коргогон.","Ал биримдикке чакырган."]},{h:"2. Эпостун мааниси",t:"Эпос — жөн гана жомок эмес. Ал элдин тарыхын, салтын, баалуулуктарын сактайт. Манас эпосу дүйнөдөгү эң чоң эпостордун бири.",examples:["Эпос аркылуу тарыхты үйрөнөбүз."]},{h:"3. Баатырлар",t:"Каныкей — акылман аял. Алмамбет — ишенимдүү дос. Семетей — Манастын уулу, Сейтек — небереси. Ар биринин өз орду бар.",examples:["Каныкей — акылмандыктын символу.","Алмамбет — достуктун символу."]},{h:"4. Манасчылар",t:"Манасчылар эпосту жатка айткан адамдар. Алар эпосту уккандан үйрөнүп, миңдеген саптарды эсинде сактаган. Бул — уникалдуу өнөр.",examples:["Манасчы — элдик ырчы."]}],vocab:[["Эпос","Баатырлар жөнүндө чоң чыгарма"],["Баатыр","Эр жүрөк, элин коргогон адам"],["Манасчы","Эпосту жатка айткан адам"],["Биримдик","Элдин бир болушу"],["Мурас","Муундан муунга калган байлык"]]},{id:10,subject:"Тарых",title:"Кыргыз каганаты",level:"Жогорку",mins:17,xp:110,emoji:"\uD83D\uDC51",color:"#FFF0B8",intro:"9-кылымда кыргыздар күчтүү мамлекет — Кыргыз каганатын түзгөн. Каганаттын борбору Ордо-Балык болгон. Бул мезгилде соода, маданият жана шаарлар өнүккөн.",sections:[{h:"1. Каганат качан түзүлгөн?",t:"840-жылы кыргыз каганаты түзүлгөн. Бул — кыргыз элинин тарыхындагы маанилүү мезгил. Каганатты каган башкарган.",examples:["840-жыл — каганаттын түзүлүшү.","9-кылым — күчтүү мезгил."]},{h:"2. Борбор жана аймак",t:"Борбору — Ордо-Балык шаары. Каганаттын аймагы кең болгон, соода жолдору андан өткөн.",examples:["Борбор — башкаруу жана соода шаары."]},{h:"3. Соода жана маданият",t:"Улуу Жибек жолу аркылуу жибек, идиштер, билим таралган. Шаарларда кол өнөрчүлөр, соодагерлер жашаган.",examples:["Жибек жолу — соода жана маданият жолу."]},{h:"4. Эмне үчүн маанилүү?",t:"Кыргыз каганаты — кыргыз мамлекеттүүлүгүнүн байыркы тарыхы. Бул тарыхты билүү — өз элиңди сыйлоо.",examples:["Тарыхты билген адам келечегин курат."]}],vocab:[["Каганат","Байыркы мамлекет"],["Каган","Мамлекет башчысы"],["Борбор","Башкаруу шаары"],["Соода","Товар алмашуу"],["Жибек жолу","Байыркы соода жолу"]]},{id:11,subject:"Биология",title:"Клетка",level:"Башталгыч",mins:14,xp:90,emoji:"\uD83D\uDD2C",color:"#D9F2FF",intro:"Бардык тирүү жандык клеткалардан турат: адам, жаныбар, өсүмдүк. Клетка — тирүүлүктүн эң кичине бирдиги. Бул сабакта клетканын бөлүктөрүн жана алардын ишин үйрөнөбүз.",sections:[{h:"1. Клетка деген эмне?",t:"Клетка — көзгө көрүнбөгөн кичине бирдик. Адамдын денесинде миллиарддаган клетка бар. Ар бир клетка өз милдетин аткарат.",examples:["Кан клеткалары, тери клеткалары, булчуң клеткалары."]},{h:"2. Клетканын бөлүктөрү",t:"Мембрана — клетканы коргойт. Ядро — клетканы башкарат. Митохондрия — энергия берет. Цитоплазма — клетканын ички чөйрөсү.",examples:["Ядро — клетканын «мээси».","Митохондрия — энергия станциясы."]},{h:"3. Клеткалар кантип көбөйөт?",t:"Клетка бөлүнүп, жаңы клеткаларды пайда кылат. Ушундайча организм өсөт, жаралар айыгат.",examples:["Бир клеткадан эки, төрт, сегиз клетка пайда болот."]},{h:"4. Эмне үчүн маанилүү?",t:"Клетканы түшүнүү — ден соолукту түшүнүү. Таза суу, туура тамактануу жана таза аба клеткаларга пайдалуу.",examples:["Ден соолук клеткадан башталат."]}],vocab:[["Клетка","Тирүү организмдин эң кичине бирдиги"],["Ядро","Клетканы башкарган бөлүк"],["Мембрана","Клетканы курчаган кабык"],["Митохондрия","Энергия берген бөлүк"],["Бөлүнүү","Клетканын көбөйүү жолу"]]},{id:12,subject:"Биология",title:"Фотосинтез",level:"Орто",mins:15,xp:100,emoji:"\uD83C\uDF31",color:"#DFF7D6",intro:"Фотосинтез — өсүмдүктөр күн нурунан азык жасаган процесс. Бул процесс болбосо өсүмдүк да, биз да жашай албайбыз: фотосинтезде биз дем алган кычкылтек пайда болот.",sections:[{h:"1. Фотосинтез деген эмне?",t:"Фотосинтез — жалбырактагы хлоропласттарда жүргөн процесс. Өсүмдүк күн нурун, сууну жана көмүр кычкыл газын колдонуп, глюкоза жасайт.",examples:["Күн + суу + көмүр кычкыл газы → глюкоза + кычкылтек"]},{h:"2. Эмне керек?",t:"Күн нуру — энергия берет. Суу — тамыр аркылуу келет. Көмүр кычкыл газы — абадан алынат. Хлорофилл — жалбыракты жашыл кылган зат.",examples:["Хлорофиллсиз фотосинтез жүрбөйт."]},{h:"3. Процесс кантип жүрөт?",t:"Күндүз жалбырак күн нурун кармайт. Хлоропласттарда суу жана газ азыкка айланат. Пайда болгон кычкылтек абага чыгат.",examples:["Күндүз өсүмдүктөр абаны тазартат."]},{h:"4. Эмне үчүн маанилүү?",t:"Фотосинтез — Жердеги жашоонун негизи. Ал азык жана кычкылтек берет. Ошондуктан өсүмдүктөрдү коргоо — өзүбүздү коргоо.",examples:["Бак-дарак отургузуу — абаны тазалоо."]}],vocab:[["Фотосинтез","Өсүмдүктүн азык жасоо процесси"],["Хлорофилл","Жалбыракты жашыл кылган зат"],["Хлоропласт","Фотосинтез жүргөн бөлүк"],["Глюкоза","Өсүмдүктүн азыгы — кант"],["Кычкылтек","Дем алуу үчүн керек болгон газ"]]}];function wq(e,n){let t=on.filter((o)=>o.subject===e.subject),l=mi.filter((o)=>o.subject===e.subject).findIndex((o)=>o.id===e.id)*5%Math.max(1,t.length),u=[];for(let o=0;o<5;o++)u.push(t[(l+o)%t.length]);return u}var th=[{id:1,subject:"Кыргыз тили",title:"10 жаңы сөздү жатта",deadline:"Бүгүн, 20:00",xp:40,detail:"Сабактагы сөздөрдү кайталап, дуэ
